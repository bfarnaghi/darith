{% load humanize money i18n %}
<div class="transaction-list{% if compact %} compact{% endif %}">
    {% for item in items %}
    <button class="transaction-row" type="button" data-dialog-open="{{ item.kind }}-edit-{{ item.id }}">
        <span class="transaction-mark {{ item.kind }}">{% if item.kind == 'income' %}+{% elif item.kind == 'expense' %}−{% else %}↔{% endif %}</span>
        <span class="transaction-copy">
            <strong>{{ item.text }}</strong>
            {% if item.kind == "transfer" %}
            <small>{{ item.source.name }} → {{ item.destination.name }}</small>
            {% else %}
            <small>{% if item.category %}{{ item.category.name }}{% else %}{% translate "Uncategorized" %}{% endif %} · {% if item.bank_account %}{{ item.bank_account.name }}{% else %}{% translate "Deleted account" %}{% endif %}</small>
            {% endif %}
        </span>
        <span class="transaction-date">{{ item.date|date:"j M Y" }}</span>
        <b class="transaction-amount {% if item.kind == 'income' %}positive{% elif item.kind == 'expense' %}negative{% endif %}">{% if item.kind == 'income' %}{{ item.amount|money_plus:budget_preference }}{% elif item.kind == 'expense' %}{{ item.amount|money_minus:budget_preference }}{% else %}{{ item.amount|money:budget_preference }}{% endif %}</b>
        <span class="row-chevron">›</span>
    </button>
    {% empty %}<div class="empty-state"><strong>{% translate "No transactions yet" %}</strong><span>{% translate "Add income, an expense, or a transfer to begin." %}</span></div>{% endfor %}
</div>
